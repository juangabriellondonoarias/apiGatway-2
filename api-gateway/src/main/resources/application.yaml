server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:TuClaveSecretaSuperSeguraParaElSena2026}

# Configuración del agregador de OpenAPI 3.0 (Swagger UI unificado)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Gestión de Usuarios (servicio-usuarios)
        url: /api/usuarios/v3/api-docs
      - name: 2. Cocina (gs-ms-cocina)
        url: /api/cocina/v3/api-docs
      - name: 3. Inventario (servicio-inventario)
        url: /api/inventario/v3/api-docs
      - name: 4. Bar y Barismo (servicio-bar)
        url: /api/bar/v3/api-docs
      - name: 5. Inicio General (servicio-inicio-general)
        url: /api/inicio/v3/api-docs
      - name: 6. Reportes (servicio-reportes)
        url: /api/reportes/v3/api-docs
      - name: 7. Restaurante (servicio-restaurante)
        url: /api/restaurante/v3/api-docs

spring:
  application:
    name: api-gateway
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${random.value}
        health-check-path: /actuator/health
        health-check-interval: 10s
    gateway:
      discovery:
        locator:
          enabled: true # Esto auto-detecta servicios en Consul como respaldo
      routes:
        # ==========================================
        # 1. GESTIÓN DE USUARIOS / AUTENTICACIÓN
        # ==========================================
        - id: usuarios-swagger
          uri: lb://servicio-usuarios
          predicates:
            - Path=/api/usuarios/v3/api-docs
          filters:
            - StripPrefix=2

        - id: usuarios-public
          uri: lb://servicio-usuarios
          predicates:
            - Path=/api/usuarios/public/**
          filters:
            - StripPrefix=2
            - PrefixPath=/api

        - id: usuarios-private
          uri: lb://servicio-usuarios
          predicates:
            - Path=/api/usuarios/**
          filters:
            - JwtAuthenticationFilter
            - name: RateLimiterFilter
              args:
                capacity: 10
                refillRate: 2
            - name: CircuitBreaker
              args:
                name: usuariosCircuitBreaker
                fallbackUri: forward:/fallback/usuarios
            - StripPrefix=2
            - PrefixPath=/api

        # ==========================================
        # 2. COCINA
        # ==========================================
        - id: cocina-swagger
          uri: lb://gs-ms-cocina
          predicates:
            - Path=/api/cocina/v3/api-docs
          filters:
            - StripPrefix=2

        - id: cocina-public
          uri: lb://gs-ms-cocina
          predicates:
            - Path=/api/cocina/public/**
          filters:
            - StripPrefix=2
            - PrefixPath=/api

        - id: cocina-private
          uri: lb://gs-ms-cocina
          predicates:
            - Path=/api/cocina/**
          filters:
            - JwtAuthenticationFilter
            - name: RateLimiterFilter
              args:
                capacity: 10
                refillRate: 2
            - name: CircuitBreaker
              args:
                name: cocinaCircuitBreaker
                fallbackUri: forward:/fallback/cocina
            - StripPrefix=2
            - PrefixPath=/api

        # ==========================================
        # 3. INVENTARIO
        # ==========================================
