            - name: CircuitBreaker
              args:
                name: restauranteCircuitBreaker
                fallbackUri: forward:/fallback/general
            - StripPrefix=2
            - PrefixPath=/api

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200" # URL de Angular
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true